# Example cron tasks configuration for yuki-conductor.
# Copy this file to ~/.yuki-conductor/workspace/cron.yaml and edit as needed.
#
# Each task has:
#   name:        Unique identifier for the task (also keys its run history)
#   display_name: (optional) Label shown in the Automations tab; renameable
#                there. Falls back to description, then a truncated prompt.
#   schedule:    Cron expression (minute hour day month weekday)
#   description: Human-readable description shown in the chat app
#   prompt:      The prompt to send to Claude Code
#   chat_app:    (optional) "slack_socket" or an installed chat plugin's name.
#                If omitted, the first enabled platform is used (slack
#                preferred). If named but not enabled, the task is skipped
#                with a warning.
#   origin_conversation: (optional) Web conversation id this task was set up in,
#                so the Automations tab can link back to it.
#   paused:      (optional) true to suspend the schedule without deleting the
#                task. Toggleable from the Automations tab; "Run now" still works.

tasks:
  - name: morning-briefing
    display_name: "Morning briefing"
    schedule: "0 9 * * 1-5"
    description: "Morning briefing (weekdays at 9am)"
    prompt: >
      Give me a concise morning briefing: check for any uncommitted changes or
      open TODOs in the codebase, summarize the git log from the past 24 hours,
      and suggest the top 1-2 things to focus on today.

  - name: daily-dependency-check
    schedule: "0 10 * * 1"
    description: "Weekly dependency check (Mondays at 10am)"
    chat_app: slack_socket
    # paused: true                 # uncomment to suspend without deleting
    prompt: >
      Check for outdated dependencies across all projects in this monorepo.
      List any packages with newer versions available and flag any known
      security advisories. Keep the summary brief.
